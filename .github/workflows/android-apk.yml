name: Build AB Cable Cost Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-verified-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK components
        shell: bash
        run: |
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify all 150 imported candidates and separate brands
        run: python3 tools/verify_import_data.py
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK signature and Android package
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 36 --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -20
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AB-Cable-Cost-V0.5.3-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Prepare Safe Source archive
        shell: bash
        run: |
          zip -rq AB_CABLE_COST_V0_5_3_SAFE_SOURCE.zip . \
            -x '.git/*' '.gradle/*' '*/build/*' 'screenshots/*' 'AB_CABLE_COST_V0_5_3_SAFE_SOURCE.zip'
          unzip -t AB_CABLE_COST_V0_5_3_SAFE_SOURCE.zip | tail -2
      - name: Publish Safe Source
        uses: actions/upload-artifact@v4
        with:
          name: AB-Cable-Cost-V0.5.3-Safe-Source
          path: AB_CABLE_COST_V0_5_3_SAFE_SOURCE.zip
          if-no-files-found: error

  emulator-smoke:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AB-Cable-Cost-V0.5.3-Debug-APK
          path: artifact
      - name: Configure KVM
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Verify sourced Global Library and technical cable card on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r artifact/app-debug.apk
            adb shell am start -W -n com.ab.cablecost/.MainActivity
            sleep 2
            adb shell pidof com.ab.cablecost
            python3 tools/verify_library_ui.py
      - name: Publish UI preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AB-Cable-Cost-V0.5.3-UI-Preview
          path: |
            screenshots/home.png
            screenshots/global_library_ar.png
            screenshots/global_library_en.png
            screenshots/cable_8723_ar.png
            screenshots/cable_8723_3d.png
            screenshots/manufacturer_candidates_en.png
            screenshots/separate_brands_en.png
            screenshots/company_search_in_library.png
            screenshots/manufacturer_filter_150.png
            screenshots/manufacturer_filter_search.png
            screenshots/manufacturer_selected_profile.png
            screenshots/*.xml
          if-no-files-found: warn

  android16-install:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AB-Cable-Cost-V0.5.3-Debug-APK
          path: artifact
      - name: Configure KVM
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Install APK and launch on Android 16 (API 36)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            test -s artifact/app-debug.apk
            adb install -r artifact/app-debug.apk
            adb shell pm path com.ab.cablecost
            adb shell am start -W -n com.ab.cablecost/.MainActivity
            sleep 3
            adb shell pidof com.ab.cablecost
