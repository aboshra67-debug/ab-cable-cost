name: Build & Install Test Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK components
        shell: bash
        run: |
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK format and signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -20
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Configure KVM
        shell: bash
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Verify install and app launch on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.ab.cablecost/.MainActivity
            sleep 3
            adb shell pidof com.ab.cablecost
      - name: Upload APK after installation test
        uses: actions/upload-artifact@v4
        with:
          name: AB-Cable-Cost-V0.1.1-Verified-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
