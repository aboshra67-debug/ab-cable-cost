name: Build AB Cable Cost Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-verified-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library-data-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify all 150 imported candidates and separate brands
        run: python3 tools/verify_import_data.py
      - name: Verify source-backed cable records against archived datasheet quotes
        run: |
          mkdir -p build/verify
          javac -encoding UTF-8 -d build/verify \
            app/src/main/java/com/ab/cablecost/CountryNames.java \
            app/src/main/java/com/ab/cablecost/VerifiedCableData.java \
            app/src/main/java/com/ab/cablecost/CableCatalog.java \
            app/src/main/java/com/ab/cablecost/CableLinks.java \
            app/src/main/java/com/ab/cablecost/CableFamilies.java \
            tools/VerifyLibraryData.java
          java -cp build/verify VerifyLibraryData .
      - name: Calculation core gives identical results to the original screen code
        run: |
          mkdir -p build/parity
          javac -encoding UTF-8 -d build/parity app/src/main/java/com/ab/cablecost/core/*.java tools/VerifyCoreParity.java
          java -Dfile.encoding=UTF-8 -cp build/parity VerifyCoreParity

  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.keycheck.outputs.has_key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK components
        shell: bash
        run: |
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify all 150 imported candidates and separate brands
        run: python3 tools/verify_import_data.py
      - name: Build debug and side-by-side APKs
        shell: bash
        run: |
          set -o pipefail
          if ! gradle :app:assembleDebug :app:assembleParallel --no-daemon --stacktrace 2>&1 | tee build.log; then
            # Surface the compiler/Gradle errors as annotations so they are readable without the raw log.
            { grep -nE "error:|What went wrong|Caused by|FAILED|\.java:[0-9]+" build.log | head -30; echo "--- last lines ---"; tail -25 build.log; } | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi
      - name: Verify APK signature and Android package
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 36 --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/parallel/app-parallel.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 36 --verbose app/build/outputs/apk/parallel/app-parallel.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/parallel/app-parallel.apk | head -16
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -20
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AB-Cable-Cost-V0.5.5-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish separate safe-install APK
        uses: actions/upload-artifact@v4
        with:
          name: AB-Cable-Cost-V0.5.5-Parallel-APK
          path: app/build/outputs/apk/parallel/*.apk
          if-no-files-found: error

      # ---- Stable release (permanent key). Needs the four repository secrets from signing/README.md ----
      - name: Check stable signing secrets
        id: keycheck
        shell: bash
        env:
          AB_KEYSTORE_BASE64: ${{ secrets.AB_KEYSTORE_BASE64 }}
          AB_KEYSTORE_PASSWORD: ${{ secrets.AB_KEYSTORE_PASSWORD }}
          AB_KEY_ALIAS: ${{ secrets.AB_KEY_ALIAS }}
          AB_KEY_PASSWORD: ${{ secrets.AB_KEY_PASSWORD }}
        run: |
          if [ -n "$AB_KEYSTORE_BASE64" ] && [ -n "$AB_KEYSTORE_PASSWORD" ] && [ -n "$AB_KEY_ALIAS" ] && [ -n "$AB_KEY_PASSWORD" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Stable signing secrets are not set: the signed release APK is skipped. See signing/README.md."
          fi
      - name: Build stable signed release APK (and a CI-only higher-versionCode copy)
        if: steps.keycheck.outputs.has_key == 'true'
        shell: bash
        env:
          AB_KEYSTORE_BASE64: ${{ secrets.AB_KEYSTORE_BASE64 }}
          AB_KEYSTORE_PASSWORD: ${{ secrets.AB_KEYSTORE_PASSWORD }}
          AB_KEY_ALIAS: ${{ secrets.AB_KEY_ALIAS }}
          AB_KEY_PASSWORD: ${{ secrets.AB_KEY_PASSWORD }}
        run: |
          export AB_KEYSTORE_FILE="$RUNNER_TEMP/ab-cable-cost-release.jks"
          printf '%s' "$AB_KEYSTORE_BASE64" | base64 -d > "$AB_KEYSTORE_FILE"
          mkdir -p dist ci-only
          gradle :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk dist/AB_Cable_Cost_V0.5.5_stable_signed.apk
          # Same key, versionCode 15: used ONLY by the emulator job to prove in-place updates work.
          gradle :app:assembleRelease --no-daemon --stacktrace -PabVersionCode=18
          cp app/build/outputs/apk/release/app-release.apk ci-only/ci_upgrade_test_versionCode18.apk
          rm -f "$AB_KEYSTORE_FILE"
      - name: Verify release APK (v1/v2/v3, pinned certificate, not debuggable, aligned)
        if: steps.keycheck.outputs.has_key == 'true'
        shell: bash
        run: bash tools/ci_verify_release_apk.sh dist/AB_Cable_Cost_V0.5.5_stable_signed.apk
      - name: Publish stable signed APK
        if: steps.keycheck.outputs.has_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AB-Cable-Cost-V0.5.5-Stable-Signed-APK
          path: dist/*.apk
          if-no-files-found: error
      - name: Publish CI-only update-test APK (do not install on a phone)
        if: steps.keycheck.outputs.has_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AB-Cable-Cost-CI-ONLY-Upgrade-Test
          path: ci-only/*.apk
          if-no-files-found: error

      - name: Publish Android signing tools for offline stable signing
        uses: actions/upload-artifact@v4
        with:
          name: AB-Cable-Cost-Android-ApkSigner-Tools
          path: |
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0/lib/apksigner.jar
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0/zipalign
          if-no-files-found: warn
      - name: Prepare Safe Source archive
        shell: bash
        run: |
          zip -rq AB_CABLE_COST_V0_5_5_SAFE_SOURCE.zip . \
            -x '.git/*' '.gradle/*' '*/build/*' 'build/*' 'dist/*' 'ci-only/*' 'screenshots/*' \
               '*.jks' '*.keystore' 'AB_CABLE_COST_V0_5_5_SAFE_SOURCE.zip'
          unzip -t AB_CABLE_COST_V0_5_5_SAFE_SOURCE.zip | tail -2
      - name: Publish Safe Source
        uses: actions/upload-artifact@v4
        with:
          name: AB-Cable-Cost-V0.5.5-Safe-Source
          path: AB_CABLE_COST_V0_5_5_SAFE_SOURCE.zip
          if-no-files-found: error

  emulator-smoke:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AB-Cable-Cost-V0.5.5-Debug-APK
          path: artifact
      - name: Configure KVM
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Verify sourced Global Library and technical cable card on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r artifact/app-debug.apk
            adb shell am start -W -n com.ab.cablecost/.MainActivity
            sleep 2
            adb shell pidof com.ab.cablecost
            python3 tools/verify_library_ui.py > ui_check.log 2>&1 || { tail -15 ui_check.log | while IFS= read -r l; do echo "::error::UI: $l"; done; exit 1; }
            cat ui_check.log
            python3 tools/verify_country_filter_ui.py com.ab.cablecost || echo "::warning::Advisory Country-filter UI test failed; see the UI preview artifact"
      - name: Publish UI preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AB-Cable-Cost-V0.5.5-UI-Preview
          path: |
            screenshots/home.png
            screenshots/global_library_ar.png
            screenshots/global_library_en.png
            screenshots/cable_8723_ar.png
            screenshots/cable_8723_3d.png
            screenshots/manufacturer_candidates_en.png
            screenshots/separate_brands_en.png
            screenshots/company_search_in_library.png
            screenshots/manufacturer_filter_150.png
            screenshots/manufacturer_filter_search.png
            screenshots/manufacturer_selected_profile.png
            screenshots/country_picker_en.png
            screenshots/country_australia_en.png
            screenshots/*.xml
          if-no-files-found: warn

  android16-install:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AB-Cable-Cost-V0.5.5-Debug-APK
          path: artifact
      - name: Download parallel install APK
        uses: actions/download-artifact@v4
        with:
          name: AB-Cable-Cost-V0.5.5-Parallel-APK
          path: safe
      - name: Configure KVM
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Install APK and launch on Android 16 (API 36)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            test -s artifact/app-debug.apk
            adb install -r artifact/app-debug.apk
            adb shell pm path com.ab.cablecost
            adb shell am start -W -n com.ab.cablecost/.MainActivity
            sleep 3
            adb shell pidof com.ab.cablecost
            echo "Installing side-by-side package with a DIFFERENT app ID"
            adb install safe/app-parallel.apk
            adb shell pm path com.ab.cablecost.safe
            adb shell am start -W -n com.ab.cablecost.safe/com.ab.cablecost.MainActivity
            sleep 3
            adb shell pidof com.ab.cablecost.safe
            adb shell pm path com.ab.cablecost
            echo "PASS Android 16: both original and safe-install apps co-exist"

  stable-release-install:
    needs: build-apk
    if: needs.build-apk.outputs.signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AB-Cable-Cost-V0.5.5-Stable-Signed-APK
          path: stable
      - uses: actions/download-artifact@v4
        with:
          name: AB-Cable-Cost-CI-ONLY-Upgrade-Test
          path: upgrade
      - name: Configure KVM
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Stable APK installs, launches and updates in place on Android ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/ci_release_install_test.sh stable/AB_Cable_Cost_V0.5.5_stable_signed.apk upgrade/ci_upgrade_test_versionCode18.apk

  # Alternative to repository secrets: publish the UNSIGNED release build (plus Google's apksigner)
  # on a throw-away branch so it can be signed OFFLINE with the permanent key.
  # The key never enters GitHub. Runs only when the signing secrets are not configured.
  unsigned-release-handoff:
    needs: build-apk
    if: needs.build-apk.outputs.signed != 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK components
        shell: bash
        run: |
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build unsigned release APK
        shell: bash
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace
          ls -l app/build/outputs/apk/release/
      - name: Check alignment and collect files
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$APK" && echo "aligned: yes" || echo "aligned: NO"
          mkdir -p handoff
          cp "$APK" handoff/app-release-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" handoff/apksigner.jar
          sha256sum handoff/app-release-unsigned.apk | tee handoff/SHA256.txt
          echo "source commit: $GITHUB_SHA" > handoff/COMMIT.txt
      - name: Publish unsigned handoff branch
        shell: bash
        run: |
          cd handoff
          git init -q -b ci-unsigned-release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Unsigned release build for offline signing ($GITHUB_SHA)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-unsigned-release
